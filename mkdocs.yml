site_name: TalkWatch
site_description: A self-hosted dashboard and alert router for UniFi Talk
repo_url: https://github.com/TheCodeSaiyan/talkwatch
edit_uri: edit/main/docs/
copyright: MIT licence. Not affiliated with Ubiquiti.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light }

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting started:
      - Trying the demo: demo.md
      - Installing: install.md
      - Behind a reverse proxy: proxy.md
      - Configuration: configuration.md
      - Upgrading: upgrading.md
  - A tour:
      - Finding your way round: using.md
      - Now: now.md
      - Operator: operator.md
      - Calls and call-backs: calls.md
      - Analytics and Switchboards: analytics.md
      - Alerts: alerts.md
      - Reports: reports.md
  - Looking after it:
      - Signing in and access: access.md
      - Retention: retention.md
      - Export and API: api.md
      - Backups: backup.md
      - Traces and metrics: observability.md
      - Data protection and recording: data-protection.md
  - Developing:
      - Building and testing: developing.md
      - Capturing the Talk API: capture.md
