site_name: TalkWatch
site_description: A self-hosted dashboard and alert router for UniFi Talk
repo_url: https://github.com/TheCodeSaiyan/talkwatch
edit_uri: edit/main/docs/
# The release workflow puts the version in front, so the published site says which release it describes.
copyright: !ENV [TALKWATCH_DOCS_FOOTER, "MIT licence. Not affiliated with Ubiquiti."]

theme:
  name: material
  # TalkWatch's own faces, bundled in assets/ as they are in the app, so the site makes no request to a font service.
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - content.code.copy
    - navigation.sections
    # A page's contents sit in the left navigation, so the page itself has the width its pictures need.
    - toc.integrate
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light }

extra_css:
  - assets/talkwatch.css

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting started:
      - Trying the demo: demo.md
      - Installing: install.md
      - Behind a reverse proxy: proxy.md
      - Reaching a console from elsewhere: remote-console.md
      - Deploying on Railway: railway.md
      - Configuration: configuration.md
      - Upgrading: upgrading.md
  - What it can help with:
      - All the guides: guides/index.md
      - Getting back to every missed caller: guides/missed-callers.md
      - Running the front desk from one screen: guides/front-desk.md
      - Voicemail that can't wait: guides/voicemail.md
      - Finding a call and what was said: guides/finding-a-call.md
      - Seeing a bad day coming: guides/busy-line.md
      - Callers who give up at the switchboard: guides/switchboard.md
      - A report in the manager's inbox: guides/reports-for-managers.md
      - Calls when you're closed: guides/out-of-hours.md
      - Staff who answer on their mobiles: guides/mobiles.md
      - Giving someone their own number: guides/one-number.md
      - Knowing when the phones themselves go wrong: guides/phone-health.md
      - Using TalkWatch's data elsewhere: guides/integrations.md
  - A tour:
      - Finding your way round: using.md
      - Now: now.md
      - Operator: operator.md
      - Calls and call-backs: calls.md
      - Analytics and Switchboards: analytics.md
      - Alerts: alerts.md
      - Reports: reports.md
  - Looking after it:
      - Signing in and access: access.md
      - Retention: retention.md
      - Export and API: api.md
      - Backups: backup.md
      - Traces and metrics: observability.md
      - Data protection and recording: data-protection.md
  - Developing:
      - Building and testing: developing.md
      - Capturing the Talk API: capture.md
