name: Release

# A tag such as v1.0.0 releases that commit: the tests and fixture guard again on a hosted runner, the upgrade from the
# last release, multi-arch images on GHCR, the documentation on GitHub Pages, and a GitHub release with notes. Day-to-day
# CI stays on the maintainer's Docker (scripts/ci.sh); this runs only for a tag, so nothing here costs minutes until then.
#
# Needs, on the repository: Pages set to deploy from GitHub Actions. GITHUB_TOKEN does the rest. Redeploying a TalkWatch on
# Railway is optional, and needs the RAILWAY_TOKEN secret and RAILWAY_SERVICE variable (docs/developing.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thecodesaiyan/talkwatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Fixture guard
        run: dotnet run --project tools/TalkWatch.FixtureGuard -c Release --no-build -- .

  # Built strictly, as local CI does, with the image pinned for the same reason: MkDocs 2.0 is announced as breaking
  # themes and plugins.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the site
        run: |
          docker run --rm -v "$PWD:/docs" -u "$(id -u):$(id -g)" -e TALKWATCH_DOCS_FOOTER="TalkWatch ${GITHUB_REF_NAME#v}. MIT licence. Not affiliated with Ubiquiti." squidfunk/mkdocs-material:9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287 \
            build --strict --site-dir /docs/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Built once, for amd64 and arm64 together, alongside the tests rather than after them, and pushed by digest with no
  # tag: nothing anyone pulls by name changes until the tests, the docs and the upgrade check have passed and the tag job
  # names it. The upgrade check runs that same image, pulled by its digest, so what's tested is what's tagged.
  #
  # The layer cache lives in the registry, under the buildcache tag. GitHub's own cache is kept per ref, and a tag's run
  # can't read the last tag's, so every release built the Go tunnel helpers and the restore from nothing.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2 and latest for a release; a pre-release (v1.2.3-rc.1) gets only its own tag, so nobody following
      # latest or 1.2 is moved onto it. The tags are applied by the tag job; the labels go into the image here.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=TalkWatch
            org.opencontainers.image.description=A self-hosted dashboard and alert router for UniFi Talk
            org.opencontainers.image.licenses=MIT

      # The Dockerfile cross-compiles on the runner's own architecture, so arm64 needs no emulation.
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: TALKWATCH_VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true

      # From the last release, as the upgrading page promises for every published image. The first release has
      # nothing to upgrade from, and the script says so rather than failing.
      - name: Upgrade from the last release
        run: scripts/upgrade-check.sh "$IMAGE:latest" "$IMAGE@${{ steps.build.outputs.digest }}"

  # Names the tested image: a new manifest pointing at what the image job pushed, so no layer is built or copied again.
  tag:
    needs: [test, docs, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "${args[1]}"

  # Redeploys the maintainer's own TalkWatch on Railway as soon as latest has moved, rather than at its next maintenance
  # window. Skipped while RAILWAY_SERVICE is unset, and for a pre-release, which doesn't move latest. Copies deployed from
  # the template follow latest by Railway's own image updates.
  railway:
    needs: tag
    if: vars.RAILWAY_SERVICE != '' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy from the new image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: npx -y @railway/cli@5.63.1 redeploy --service "$RAILWAY_SERVICE" --from-source --yes

  pages:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  release:
    needs: [tag, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          version="${TAG#v}"
          gh release create "$TAG" --verify-tag --generate-notes $prerelease --notes "$(cat <<EOF
          The image is \`$IMAGE:$version\`, for amd64 and arm64. Take a [backup](https://thecodesaiyan.github.io/talkwatch/backup/) before upgrading; [Upgrading](https://thecodesaiyan.github.io/talkwatch/upgrading/) says how.
          EOF
          )"
