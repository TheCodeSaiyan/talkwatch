name: Release

# A tag such as v1.0.0 releases that commit: the tests and fixture guard again on a hosted runner, the upgrade from the
# last release, multi-arch images on GHCR, the documentation on GitHub Pages, and a GitHub release with notes. Day-to-day
# CI stays on the maintainer's Docker (scripts/ci.sh); this runs only for a tag, so nothing here costs minutes until then.
#
# Needs, on the repository: Pages set to deploy from GitHub Actions. GITHUB_TOKEN does the rest. Redeploying a TalkWatch on
# Railway is optional, and needs the RAILWAY_TOKEN secret and RAILWAY_SERVICE variable (docs/developing.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thecodesaiyan/talkwatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Fixture guard
        run: dotnet run --project tools/TalkWatch.FixtureGuard -c Release --no-build -- .

  # Built strictly, as local CI does, with the image pinned for the same reason: MkDocs 2.0 is announced as breaking
  # themes and plugins.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the site
        run: |
          docker run --rm -v "$PWD:/docs" -u "$(id -u):$(id -g)" squidfunk/mkdocs-material:9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287 \
            build --strict --site-dir /docs/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  image:
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2 and latest for a release; a pre-release (v1.2.3-rc.1) gets only its own tag, so nobody following
      # latest or 1.2 is moved onto it.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=TalkWatch
            org.opencontainers.image.description=A self-hosted dashboard and alert router for UniFi Talk
            org.opencontainers.image.licenses=MIT

      # amd64 alone first, loaded into Docker, so the upgrade check runs the image that's about to be pushed. The
      # Dockerfile cross-compiles on the runner's own architecture, so arm64 needs no emulation either.
      - name: Build for the upgrade check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: talkwatch:release
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      # From the last release, as the upgrading page promises for every published image. The first release has
      # nothing to upgrade from, and the script says so rather than failing.
      - name: Upgrade from the last release
        run: scripts/upgrade-check.sh "$IMAGE:latest" talkwatch:release

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  # Redeploys the maintainer's own TalkWatch on Railway as soon as latest has moved, rather than at its next maintenance
  # window. Skipped while RAILWAY_SERVICE is unset, and for a pre-release, which doesn't move latest. Copies deployed from
  # the template follow latest by Railway's own image updates.
  railway:
    needs: image
    if: vars.RAILWAY_SERVICE != '' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy from the new image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: npx -y @railway/cli@5.63.1 redeploy --service "$RAILWAY_SERVICE" --from-source --yes

  pages:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  release:
    needs: [image, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          version="${TAG#v}"
          gh release create "$TAG" --verify-tag --generate-notes $prerelease --notes "$(cat <<EOF
          The image is \`$IMAGE:$version\`, for amd64 and arm64. Take a [backup](https://thecodesaiyan.github.io/talkwatch/backup/) before upgrading; [Upgrading](https://thecodesaiyan.github.io/talkwatch/upgrading/) says how.
          EOF
          )"
