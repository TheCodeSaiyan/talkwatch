# The workflows' actions are pinned to commits, and the image's base images to digests, so a tag moved upstream can't
# change what runs with the release's write access or what ships in the image. Dependabot keeps the pins current, each
# as a pull request to read before it merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
